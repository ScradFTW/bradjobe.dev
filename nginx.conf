# Cloud Run's metadata-server resolver. Upstreams are set through variables
# below so nginx resolves them per request instead of once at startup.
resolver 169.254.169.254 valid=300s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Firebase Hosting (bradjobe-dev-infra/hosting) rewrites these API paths
    # here because it can forward a path but not rewrite it, and each backend
    # only serves its bare /predict, /chat or /stats. This used to be the
    # load balancer's url_rewrite rules.
    set $genre https://genre-classifier-2acspcik5a-nn.a.run.app;
    set $image https://image-classifier-2acspcik5a-nn.a.run.app;
    set $agent https://agent-orchestrator-2acspcik5a-nn.a.run.app;

    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    client_max_body_size 32m; # image-classifier uploads; Cloud Run caps requests at 32MB
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /genre-classifier/api/predict { proxy_pass $genre/predict; }
    location = /image-classifier/api/predict { proxy_pass $image/predict; }
    location = /agent-demo/api/chat          { proxy_pass $agent/chat; }
    location = /status/api/agent-stats       { proxy_pass $agent/stats; }
    location = /status/api/genre-stats       { proxy_pass $genre/stats; }
    location = /status/api/image-stats       { proxy_pass $image/stats; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
